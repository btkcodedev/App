name: Monitor Expensify Bounties

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  monitor-bounties:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check for bounty issues
        id: check-issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: 'Expensify',
              repo: 'App',
              state: 'open',
              labels: 'Help Wanted',
              per_page: 100,
              sort: 'created',
              direction: 'desc'
            });
            
            // Get timestamp of last check (24 hours ago as fallback)
            const lastCheck = new Date(Date.now() - 24 * 60 * 60 * 1000);
            
            const bountyIssues = issues.data.filter(issue => {
              const title = issue.title;
              const createdAt = new Date(issue.created_at);
              
              // Check if issue has $250 or $500 in title
              const hasBounty = /\$250|\$500/i.test(title);
              
              // Only include recent issues
              const isRecent = createdAt > lastCheck;
              
              return hasBounty && isRecent;
            });
            
            if (bountyIssues.length > 0) {
              let emailBody = '# New Bounty Issues Found!\n\n';
              
              bountyIssues.forEach(issue => {
                const bountyMatch = issue.title.match(/\$\d+/);
                const bounty = bountyMatch ? bountyMatch[0] : 'Unknown';
                
                emailBody += `## ${issue.title}\n`;
                emailBody += `- **Bounty:** ${bounty}\n`;
                emailBody += `- **Issue:** #${issue.number}\n`;
                emailBody += `- **Link:** ${issue.html_url}\n`;
                emailBody += `- **Created:** ${issue.created_at}\n\n`;
              });
              
              core.setOutput('has-bounties', 'true');
              core.setOutput('email-body', emailBody);
              core.setOutput('issue-count', bountyIssues.length);
            } else {
              core.setOutput('has-bounties', 'false');
            }
      
      - name: Send Email Notification
        if: steps.check-issues.outputs.has-bounties == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🎯 ${{ steps.check-issues.outputs.issue-count }} New Expensify Bounty Issue(s) Found!'
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: ${{ steps.check-issues.outputs.email-body }}
          content_type: text/markdown
