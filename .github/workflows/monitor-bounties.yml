name: Monitor Expensify Bounties

on:
  schedule:
    # Runs every 45 minutes
    - cron: '*/45 * * * *'
  workflow_dispatch:

jobs:
  monitor-bounties:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Ensure tracking file exists
        run: mkdir -p .github && touch .github/sent-issues.json

      - name: Check for bounty issues
        id: check-issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.github/sent-issues.json';

            // Load previously sent issues
            let sentIssues = [];
            try {
              if (fs.existsSync(path)) {
                sentIssues = JSON.parse(fs.readFileSync(path, 'utf8'));
              }
            } catch (error) {
              console.log('No previous record found, starting fresh');
            }

            // Use GitHub search API with created date filter
            const twoDaysAgo = new Date();
            twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
            const createdFilter = twoDaysAgo.toISOString().split('T')[0];

            // Search 1: Issues with Help Wanted label
            const helpWantedQuery = `repo:Expensify/App is:issue is:open label:"Help Wanted" created:>=${createdFilter}`;
            const helpWantedIssues = await github.rest.search.issuesAndPullRequests({
              q: helpWantedQuery,
              sort: 'created',
              order: 'desc',
              per_page: 100
            });
            console.log(`Found ${helpWantedIssues.data.items.length} Help Wanted issues`);

            // Search 2: Issues with $250 in title (regardless of label) - search for any $250 pattern
            const high250Query = `repo:Expensify/App is:issue is:open $250 in:title created:>=${createdFilter}`;
            const high250Issues = await github.rest.search.issuesAndPullRequests({
              q: high250Query,
              sort: 'created',
              order: 'desc',
              per_page: 100
            });
            console.log(`Found ${high250Issues.data.items.length} $250 issues`);

            // Combine and deduplicate issues
            const allIssuesMap = new Map();
            [...helpWantedIssues.data.items, ...high250Issues.data.items].forEach(issue => {
              allIssuesMap.set(issue.number, issue);
            });
            console.log(`Total unique issues after combining: ${allIssuesMap.size}`);

            // Filter for bounty issues not yet sent
            const bountyIssues = Array.from(allIssuesMap.values()).filter(issue => {
              const title = issue.title;
              const notSent = !sentIssues.includes(issue.number);
              const has250 = /\$250|\[\$250\]/i.test(title);
              const hasBounty = /\$50|\$100|\$125|\$250|\$300|\$500/i.test(title);
              const hasHelpWanted = issue.labels.some(label => label.name === 'Help Wanted');
              
              console.log(`Issue #${issue.number}: has250=${has250}, hasBounty=${hasBounty}, hasHelpWanted=${hasHelpWanted}, notSent=${notSent}`);
              
              // Include if NOT already sent AND:
              // 1. Has $250 or [$250] in title (regardless of labels) OR
              // 2. Has any bounty AND has Help Wanted label
              return notSent && (has250 || (hasBounty && hasHelpWanted));
            });
            console.log(`Filtered to ${bountyIssues.length} bounty issues to notify`);

            // Sort by creation date - newest first
            bountyIssues.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (bountyIssues.length > 0) {
              let emailBody = '# New Bounty Issues Found!\n\n';
              let hasHighProbability = false;

              bountyIssues.forEach(issue => {
                const bountyMatch = issue.title.match(/\$\d+/);
                const bounty = bountyMatch ? bountyMatch[0] : 'Unknown';
                const isHighProbability = issue.user.login === 'mitarachim';

                if (isHighProbability) {
                  hasHighProbability = true;
                  emailBody += `## 🔥 HIGH PROBABILITY: ${issue.title}\n`;
                } else {
                  emailBody += `## ${issue.title}\n`;
                }
                
                emailBody += `- Bounty: ${bounty}\n`;
                emailBody += `- Issue: #${issue.number}\n`;
                emailBody += `- Creator: @${issue.user.login}\n`;
                emailBody += `- Comments: ${issue.comments}\n`;
                emailBody += `- Link: ${issue.html_url}\n`;
                emailBody += `- Created: ${issue.created_at}\n`;
                emailBody += `- Labels: ${issue.labels.map(l => l.name).join(', ')}\n\n`;

                // Track this issue as notified
                sentIssues.push(issue.number);
              });

              // Keep only last 500
              if (sentIssues.length > 500) {
                sentIssues = sentIssues.slice(-500);
              }

              fs.writeFileSync(path, JSON.stringify(sentIssues, null, 2));

              core.setOutput('has-bounties', 'true');
              core.setOutput('email-body', emailBody);
              core.setOutput('issue-count', bountyIssues.length);
              core.setOutput('updated', 'true');
              core.setOutput('high-probability', hasHighProbability.toString());
            } else {
              core.setOutput('has-bounties', 'false');
              core.setOutput('updated', 'false');
              core.setOutput('high-probability', 'false');
            }

      - name: Commit tracking file
        if: steps.check-issues.outputs.updated == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/sent-issues.json
          git commit -m "Track sent bounty notifications" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Send Email Notification
        if: steps.check-issues.outputs.has-bounties == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: ${{ steps.check-issues.outputs.high-probability == 'true' && format('High Probability - New Expensify Bounties ({0})', steps.check-issues.outputs.issue-count) || format('New Expensify Bounties ({0})', steps.check-issues.outputs.issue-count) }}
          body: ${{ steps.check-issues.outputs.email-body }}
          html_body: ${{ steps.check-issues.outputs.email-body }}
          convert_markdown: true
