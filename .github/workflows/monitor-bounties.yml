name: Monitor Expensify Bounties

on:
  schedule:
    # Runs every 45 minutes
    - cron: '*/45 * * * *'
  workflow_dispatch:

jobs:
  monitor-bounties:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Ensure tracking file exists
        run: mkdir -p .github && touch .github/sent-issues.json

      - name: Check for bounty issues
        id: check-issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.github/sent-issues.json';

            // Load previously sent issues
            let sentIssues = [];
            try {
              if (fs.existsSync(path)) {
                sentIssues = JSON.parse(fs.readFileSync(path, 'utf8'));
              }
            } catch (error) {
              console.log('No previous record found, starting fresh');
            }

            // Use direct GitHub Issues API with since parameter for real-time detection
            const oneDayAgo = new Date();
            oneDayAgo.setDate(oneDayAgo.getDate() - 1);
            const sinceTimestamp = oneDayAgo.toISOString();

            // Fetch ALL issues using pagination (Expensify/App is very active)
            console.log(`Fetching issues since ${sinceTimestamp}`);
            let allIssuesData = [];
            let page = 1;
            let hasMore = true;
            
            while (hasMore) {
              const response = await github.rest.issues.listForRepo({
                owner: 'Expensify',
                repo: 'App',
                state: 'open',
                since: sinceTimestamp,
                per_page: 100,
                page: page,
                sort: 'created',
                direction: 'desc'
              });
              
              allIssuesData = allIssuesData.concat(response.data);
              console.log(`Page ${page}: fetched ${response.data.length} issues`);
              
              if (response.data.length < 100) {
                hasMore = false;
              } else {
                page++;
                // Safety limit to prevent infinite loops
                if (page > 10) {
                  console.log('Reached page limit of 10');
                  hasMore = false;
                }
              }
            }
            console.log(`Total fetched: ${allIssuesData.length} issues from live database`);

            // Filter locally for $250 or $125 in title
            const bountyIssues = allIssuesData.filter(issue => {
              // Skip pull requests (they come back from issues endpoint too)
              if (issue.pull_request) {
                return false;
              }

              const title = issue.title;
              const notSent = !sentIssues.includes(issue.number);
              
              // Sharp check for $250 or $125 in title
              const matchesTarget = /\$250|\[\$250\]|\$125|\[\$125\]/i.test(title);
              
              console.log(`Issue #${issue.number}: title="${title}", matchesTarget=${matchesTarget}, notSent=${notSent}`);
              
              // Include if NOT already sent AND matches target bounty
              return notSent && matchesTarget;
            });
            console.log(`Filtered to ${bountyIssues.length} bounty issues to notify`);

            // Sort by creation date - newest first
            bountyIssues.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (bountyIssues.length > 0) {
              let emailBody = '# New Bounty Issues Found!\n\n';
              let hasHighProbability = false;

              bountyIssues.forEach(issue => {
                const bountyMatch = issue.title.match(/\$\d+/);
                const bounty = bountyMatch ? bountyMatch[0] : 'Unknown';
                const isHighProbability = issue.user.login === 'mitarachim';

                if (isHighProbability) {
                  hasHighProbability = true;
                  emailBody += `## 🔥 HIGH PROBABILITY: ${issue.title}\n`;
                } else {
                  emailBody += `## ${issue.title}\n`;
                }
                
                emailBody += `- Bounty: ${bounty}\n`;
                emailBody += `- Issue: #${issue.number}\n`;
                emailBody += `- Creator: @${issue.user.login}\n`;
                emailBody += `- Comments: ${issue.comments}\n`;
                emailBody += `- Link: ${issue.html_url}\n`;
                emailBody += `- Created: ${issue.created_at}\n`;
                emailBody += `- Labels: ${issue.labels.map(l => l.name).join(', ')}\n\n`;

                // Track this issue as notified
                sentIssues.push(issue.number);
              });

              // Keep only last 500
              if (sentIssues.length > 500) {
                sentIssues = sentIssues.slice(-500);
              }

              fs.writeFileSync(path, JSON.stringify(sentIssues, null, 2));

              core.setOutput('has-bounties', 'true');
              core.setOutput('email-body', emailBody);
              core.setOutput('issue-count', bountyIssues.length);
              core.setOutput('updated', 'true');
              core.setOutput('high-probability', hasHighProbability.toString());
            } else {
              core.setOutput('has-bounties', 'false');
              core.setOutput('updated', 'false');
              core.setOutput('high-probability', 'false');
            }

      - name: Commit tracking file
        if: steps.check-issues.outputs.updated == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/sent-issues.json
          git commit -m "Track sent bounty notifications" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Send Email Notification
        if: steps.check-issues.outputs.has-bounties == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: ${{ steps.check-issues.outputs.high-probability == 'true' && format('High Probability - New Expensify Bounties ({0})', steps.check-issues.outputs.issue-count) || format('New Expensify Bounties ({0})', steps.check-issues.outputs.issue-count) }}
          body: ${{ steps.check-issues.outputs.email-body }}
          html_body: ${{ steps.check-issues.outputs.email-body }}
          convert_markdown: true
