name: Monitor Expensify Bounties

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  monitor-bounties:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      
      - name: Check for bounty issues
        id: check-issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.github/sent-issues.json';
            
            // Load previously sent issues
            let sentIssues = [];
            try {
              if (fs.existsSync(path)) {
                sentIssues = JSON.parse(fs.readFileSync(path, 'utf8'));
              }
            } catch (error) {
              console.log('No previous record found, starting fresh');
            }
            
            // Fetch open issues with Help Wanted label
            const issues = await github.rest.issues.listForRepo({
              owner: 'Expensify',
              repo: 'App',
              state: 'open',
              labels: 'Help Wanted',
              per_page: 100,
              sort: 'created',
              direction: 'desc'
            });
            
            // Filter for bounty issues
            const bountyIssues = issues.data.filter(issue => {
              const title = issue.title;
              const hasBounty = /\$250|\$500/i.test(title);
              const notSent = !sentIssues.includes(issue.number);
              
              return hasBounty && notSent;
            });
            
            if (bountyIssues.length > 0) {
              let emailBody = '# New Bounty Issues Found!\n\n';
              
              bountyIssues.forEach(issue => {
                const bountyMatch = issue.title.match(/\$\d+/);
                const bounty = bountyMatch ? bountyMatch[0] : 'Unknown';
                
                emailBody += `## ${issue.title}\n`;
                emailBody += `- **Bounty:** ${bounty}\n`;
                emailBody += `- **Issue:** #${issue.number}\n`;
                emailBody += `- **Link:** ${issue.html_url}\n`;
                emailBody += `- **Created:** ${issue.created_at}\n`;
                emailBody += `- **Labels:** ${issue.labels.map(l => l.name).join(', ')}\n\n`;
                
                // Add to sent list
                sentIssues.push(issue.number);
              });
              
              // Keep only last 500 issue numbers to prevent file from growing too large
              if (sentIssues.length > 500) {
                sentIssues = sentIssues.slice(-500);
              }
              
              // Save updated list
              fs.writeFileSync(path, JSON.stringify(sentIssues, null, 2));
              
              core.setOutput('has-bounties', 'true');
              core.setOutput('email-body', emailBody);
              core.setOutput('issue-count', bountyIssues.length);
              core.setOutput('updated', 'true');
            } else {
              core.setOutput('has-bounties', 'false');
              core.setOutput('updated', 'false');
            }
      
      - name: Commit tracking file
        if: steps.check-issues.outputs.updated == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/sent-issues.json
          git commit -m "Track sent bounty notifications" || echo "No changes to commit"
          git push || echo "No changes to push"
      
      - name: Send Email Notification
        if: steps.check-issues.outputs.has-bounties == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🎯 ${{ steps.check-issues.outputs.issue-count }} New Expensify Bounty Issue(s) Found!'
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: ${{ steps.check-issues.outputs.email-body }}
          content_type: text/markdown
